# RAM warning dialog
ram_dialog_title=Performance Warning
ram_dialog_heading=Performance Warning
ram_dialog_body_1=You have less than <b>8192 MB</b> of memory allocated.
ram_dialog_body_2=Wildeprojekt <b>needs</b> at least <b>8192 MB</b> to function properly!
ram_dialog_link=View the guide on how to increase allocated memory here.
ram_dialog_link_url=https://www.ardacraft.me/resources/guide-to-allocating-more-memory
ram_dialog_footer_1=If you continue without allocating at least 8192 MB of memory you <b>will</b> run into issues.
ram_dialog_footer_2=We cannot provide support for you if you have not allocated the correct amount of memory.
ram_dialog_confirm=I understand the risk and want to continue anyway.
